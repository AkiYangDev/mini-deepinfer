[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-deepinfer"
version = "0.2.0"
description = "A small educational inference engine targeting Ascend 910C"
readme = "README.en.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AkiYangDev"}]
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.5,<2.11", "transformers>=4.46.3,<6", "safetensors>=0.5,<0.9"]
qwen35 = ["torch>=2.5,<2.11", "transformers==5.12.1", "safetensors>=0.5,<0.9"]

[project.urls]
Repository = "https://github.com/AkiYangDev/mini-deepinfer"
Documentation = "https://github.com/AkiYangDev/mini-deepinfer/blob/main/docs/START_HERE.md"
Issues = "https://github.com/AkiYangDev/mini-deepinfer/issues"

[tool.setuptools.packages.find]
include = ["minideepinfer*"]

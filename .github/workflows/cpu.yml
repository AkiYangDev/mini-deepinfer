name: CPU checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_evidence.py
      - run: python scripts/check_evidence.py --index docs/results/v0.2/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/pipeline-benchmark/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/first-result/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/admission/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/speculative/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/hybrid-rollback/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/lookup-draft/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/v0.3/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/model-draft/evidence.json
      - run: python scripts/check_evidence.py --index docs/results/draft-snapshot/evidence.json
      - run: python -m minideepinfer
      - run: python -m minideepinfer.batch_demo
      - run: python -m minideepinfer.step_demo
      - run: python -m minideepinfer.pipeline_demo --help
      - run: python -m minideepinfer.spec_demo --help
      - run: python -m minideepinfer.model_draft_demo --help
      - run: python -m minideepinfer.npu_step_demo --help
      - run: python -m minideepinfer.verify_deferred --help
      - run: python -m minideepinfer.verify_deferred_engine --help
      - run: python -m minideepinfer.verify_decode_pipeline --help
      - run: python -m minideepinfer.verify_stopping_pipeline --help
      - run: python -m minideepinfer.verify_arrivals --help
      - run: python -m minideepinfer.verify_chunk_pipeline --help
      - run: python -m minideepinfer.verify_pipeline_text --help
      - run: python -m minideepinfer.generate --help
      - run: python -m minideepinfer.benchmark_prepare --help
      - run: python -m minideepinfer.benchmark_pipeline --help
      - run: python -m minideepinfer.benchmark_first_result --help
      - run: python -m minideepinfer.analyze_prepare_trace --help
      - run: python -m examples.profile_prepare --help
      - run: python -m examples.compare_sampler_order --help
      - run: python -m examples.analyze_sampler_order --help

  numerical:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        transformers: ["4.46.3", "5.12.1"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[model]" transformers==${{ matrix.transformers }} safetensors==0.5.3
      - run: python -m unittest discover -s tests -v
      - run: python -m minideepinfer.pipeline_demo --output outputs/pipeline-demo.json
      - run: python -m minideepinfer.spec_demo --output outputs/spec-demo.json
      - run: python -m minideepinfer.spec_demo --hybrid --output outputs/hybrid-rollback.json
      - run: python -m minideepinfer.spec_demo --draft lookup --hybrid --output outputs/lookup-draft.json
      - run: python -m minideepinfer.model_draft_demo --output outputs/model-draft.json
      - run: python -m minideepinfer.model_draft_demo --compare-draft-snapshots --repeats 1 --output outputs/draft-snapshot.json
      - run: python -m minideepinfer.verify_deferred --device cpu --output outputs/deferred-cpu.json
      - run: python -m minideepinfer.verify_deferred_engine --device cpu --output outputs/deferred-engine-cpu.json
      - run: python -m minideepinfer.verify_decode_pipeline --device cpu --output outputs/decode-pipeline-cpu.json
      - run: python -m minideepinfer.verify_stopping_pipeline --device cpu --output outputs/stopping-pipeline-cpu.json
      - run: python -m minideepinfer.verify_arrivals --device cpu --output outputs/arrivals-cpu.json
      - run: python -m minideepinfer.verify_chunk_pipeline --device cpu --output outputs/chunk-pipeline-cpu.json
      - run: python -m minideepinfer.verify_pipeline_text --device cpu --trace-rounds --output outputs/pipeline-text-cpu.json
      - run: python -m minideepinfer.benchmark_prepare --device cpu --repeats 1 --output outputs/prepare-cpu.json
      - run: python -m minideepinfer.benchmark_pipeline --device cpu --repeats 1 --output outputs/pipeline-benchmark-cpu.json
      - run: python -m minideepinfer.benchmark_pipeline --compare-admission --device cpu --repeats 1 --output outputs/admission-cpu.json
      - run: python -m minideepinfer.benchmark_first_result --device cpu --repeats 1 --output outputs/first-result-cpu.json
      - run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/mini-dist" .
      - run: python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/mini-dist/*.whl
      - run: python -I -m minideepinfer.verify_pipeline_text --device cpu --output installed-pipeline-text.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.pipeline_demo --output installed-pipeline-demo.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.spec_demo --output installed-spec-demo.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.spec_demo --hybrid --output installed-hybrid-rollback.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.spec_demo --draft lookup --hybrid --output installed-lookup-draft.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.model_draft_demo --output installed-model-draft.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.model_draft_demo --compare-draft-snapshots --output installed-draft-snapshot.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.benchmark_pipeline --repeats 1 --output installed-pipeline-benchmark.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.benchmark_pipeline --compare-admission --repeats 1 --output installed-admission.json
        working-directory: ${{ runner.temp }}
      - run: python -I -m minideepinfer.benchmark_first_result --repeats 1 --output installed-first-result.json
        working-directory: ${{ runner.temp }}

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/mini-dist" .
      - run: python -m venv "$RUNNER_TEMP/mini-install"
      - run: '"$RUNNER_TEMP/mini-install/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/mini-dist/*.whl'
      - name: Run the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/mini-install/bin/python" -I -c "from importlib.metadata import version; assert version('mini-deepinfer') == '0.4.0.dev0'"
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer.batch_demo
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer.step_demo
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer.generate --help
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer.pipeline_demo --help
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer.spec_demo --help
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer.model_draft_demo --help
          "$RUNNER_TEMP/mini-install/bin/python" -I -m minideepinfer.verify_chunk_pipeline --help
